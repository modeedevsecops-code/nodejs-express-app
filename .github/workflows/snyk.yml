name: Snyk Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  snyk:
    name: Run Snyk Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Node.js (needed for snyk CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run Snyk test
      - name: Run Snyk test
        uses: snyk/actions@v1  # Correct version (v1) for Snyk action
        with:
          command: test

      # Step 5: Upload Snyk results to GitHub as an artifact (use actions/upload-artifact@v4)
      - name: Upload Snyk test results
        uses: actions/upload-artifact@v4  # Use the latest version to avoid deprecation issues
        with:
          name: snyk-results
          path: snyk-results.json  # Adjust this based on where your Snyk test output is stored

name: CI Pipeline with DAST (OWASP ZAP)

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    branches:
      - '**'  # Runs on pull requests to any branch

jobs:
  container-scan:
    name: Build Docker Image and Scan with OWASP ZAP
    runs-on: ubuntu-latest
    services:
      # Start a Docker service with the image for ZAP to target
      zap:
        image: owasp/zap2docker-stable
        options: --network="host"  # Allows ZAP to connect to the host network
        ports:
          - 8080:8080  # Expose ZAP port
        entrypoint: ["zap.sh", "-daemon", "-port", "8080", "-host", "0.0.0.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-app:latest .  # Replace with your Docker image name and tag

      - name: Run Docker Container
        run: |
          docker run -d -p 8081:8080 --name my-app-container my-app:latest  # Run the container on port 8081

      - name: Wait for Container to Be Ready
        run: |
          # Wait for the container to be ready and accepting traffic (e.g., HTTP)
          sleep 30  # Adjust the sleep duration if necessary

      - name: Run OWASP ZAP Scan
        run: |
          # Start the ZAP scan on the running container
          docker exec -t my-app-container zap-baseline.py -t http://localhost:8081  # Target the container's exposed port

      - name: Stop Docker Container
        run: |
          docker stop my-app-container
          docker rm my-app-container

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-scan-report
          path: zap-report.html  # Upload the ZAP report

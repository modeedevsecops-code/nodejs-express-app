name: CI Pipeline with SCA (Snyk)

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    branches:
      - '**'  # Runs on pull requests to any branch

jobs:
  # --- SCA: Snyk Security Testing ---
  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Snyk
        uses: snyk/actions/setup@v2
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}  # Store your Snyk token in GitHub secrets

      - name: Run Snyk Test
        run: snyk test --all-projects  # Scan all project dependencies for vulnerabilities

      - name: Run Snyk Monitor (Optional)
        run: snyk monitor --all-projects  # Optional: This sends your dependencies to Snyk to monitor for new vulnerabilities

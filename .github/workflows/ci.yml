name: CI Pipeline with Snyk SCA Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  snyk:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2
        
      # Set up Node.js (adjust if using another language)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Install Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # Run Snyk test to scan for vulnerabilities
      - name: Run Snyk SCA scan
        run: snyk test --all-projects

      # Optionally, monitor the project for ongoing tracking (Optional)
      - name: Monitor with Snyk (Optional)
        run: snyk monitor

name: CI Pipeline

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    branches:
      - '**'  # Runs on pull requests to any branch

jobs:
  # --- SAST: CodeQL ---
  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: [ 'javascript', 'typescript' ]  # Remove duplicates and reference languages only once

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}  # Dynamically picks the language from the matrix

      - name: Autobuild (if applicable)
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true  # Optional: Continue even if autobuild fails (useful for some languages)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true  # Optional: Continue on error, depending on your workflow preferences

      - name: Upload CodeQL Analysis Results
        uses: actions/upload-artifact@v3
        with:
          name: codeql-report
          path: ./codeql-results/  # Path to CodeQL results

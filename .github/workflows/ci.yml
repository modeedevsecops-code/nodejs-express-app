name: CI Pipeline with Container Scanning (Trivy)

on:
  push:
    branches:
      - '**'  # Runs on all branches
  pull_request:
    branches:
      - '**'  # Runs on pull requests to any branch

jobs:
  # --- Build and Container Scanning (Trivy) ---
  container-scan:
    name: Build Docker Image and Scan with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2  # Sets up Docker Buildx for multi-platform builds

      - name: Build Docker Image
        run: |
          docker build -t my-app:latest .  # Replace with your image name and tag

      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.34.0/trivy_0.34.0_Linux-x86_64.tar.gz
          tar zxvf trivy_0.34.0_Linux-x86_64.tar.gz
          sudo mv trivy /usr/local/bin/  # Install Trivy globally

      - name: Run Trivy Scan on Docker Image
        run: |
          trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL my-app:latest  # Adjust severity levels as needed

      - name: Upload Trivy Scan Results
        uses: actions/upload-artifact@v3
        with:
          name: trivy-scan-results
          path: trivy-results.json  # If you want to store the results for inspection, you can output them into a file

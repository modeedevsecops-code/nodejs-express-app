name: CodeQL Analysis

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up CodeQL
        uses: github/codeql-action/setup@v2
        with:
          languages: javascript  # Analyze JavaScript code

      - name: Perform CodeQL analysis
        run: |
          # Initialize the CodeQL database and perform the analysis
          codeql database init --language=javascript --db-dir=./codeql-db
          codeql database analyze ./codeql-db --format=sarif-latest --output=codeql-results.sarif

      - name: Upload CodeQL results
        uses: actions/upload-artifact@v3  # Updated to v3
        with:
          name: codeql-results
          path: codeql-results.sarif

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: codeql-results.sarif

name: CodeQL Analysis

on:
  push:
    branches:
      - main  # Run on push to the main branch
  pull_request:
    branches:
      - main  # Run on pull request targeting the main branch

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up CodeQL
        uses: github/codeql-action/setup@v2
        with:
          languages: javascript  # Language of the project (adjust if needed)

      - name: Run CodeQL analysis
        run: |
          codeql database init --language=javascript --db-dir=./codeql-db
          codeql database analyze ./codeql-db --format=sarif-latest --output=codeql-results.sarif

      - name: Upload CodeQL results
        uses: actions/upload-artifact@v2
        with:
          name: codeql-results
          path: codeql-results.sarif

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: codeql-results.sarif
